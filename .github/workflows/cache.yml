name: Cache
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64-linux:
    name: cachix x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          # GitHub runners have it; act containers do not.
          init: none

      - name: Build package
        run: nix build ".#packages.x86_64-linux.default" --out-link pkg

      - name: Build VM closures
        run: |
          nix build ".#packages.x86_64-linux.demo-vm" --out-link vm
          nix build ".#checks.x86_64-linux.excaliself-module.driver" --out-link driver

      - name: Push to cachix
        if: ${{ env.ACT != 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install nixpkgs#cachix --profile "$PWD/.cachix-profile"
          pushed=""
          for link in pkg vm driver; do
            test -e "$link" || continue
            echo "::group:: cachix push $link"
            "$PWD/.cachix-profile/bin/cachix" push nix-excaliself "$(readlink -f "$link")"
            echo "::endgroup::"
            pushed=yes
          done
          test -n "$pushed" || echo "Nothing to push."

  build-aarch64-linux:
    name: cachix aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          init: none

      - name: Build package
        run: nix build ".#packages.aarch64-linux.default" --out-link pkg

      - name: Build VM closures
        run: |
          nix build ".#packages.aarch64-linux.demo-vm" --out-link vm
          nix build ".#checks.aarch64-linux.excaliself-module.driver" --out-link driver

      - name: Push to cachix
        if: ${{ env.ACT != 'true' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install nixpkgs#cachix --profile "$PWD/.cachix-profile"
          pushed=""
          for link in pkg vm driver; do
            test -e "$link" || continue
            echo "::group:: cachix push $link"
            "$PWD/.cachix-profile/bin/cachix" push nix-excaliself "$(readlink -f "$link")"
            echo "::endgroup::"
            pushed=yes
          done
          test -n "$pushed" || echo "Nothing to push."
