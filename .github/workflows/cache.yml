name: Cache
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64-linux:
    name: cachix x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-excaliself
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#packages.x86_64-linux.default
      - run: |
          nix build --print-build-logs .#packages.x86_64-linux.demo-vm
          nix build --print-build-logs .#checks.x86_64-linux.excaliself-module.driver

  build-aarch64-linux:
    name: cachix aarch64-linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-excaliself
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#packages.aarch64-linux.default
      - run: |
          nix build --print-build-logs .#packages.aarch64-linux.demo-vm
          nix build --print-build-logs .#checks.aarch64-linux.excaliself-module.driver
